name: Vynalth Lexicon CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main

jobs:
  verify-and-build:
    name: Lint, Typecheck, Unit Tests, Importer & Production Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript strict typecheck
        run: npm run typecheck

      - name: Run Vitest unit & API tests
        run: npm test

      - name: Verify Wiktextract streaming JSONL import pipeline
        run: npm run import:wiktextract -- --dry-run

      - name: Run Next.js production build
        run: npm run build

      - name: Run responsive browser and production offline tests
        run: |
          npm run start -- --hostname 0.0.0.0 --port 3000 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 1
          done
          TEST_OFFLINE=1 npm run test:e2e
